services:
  file-browser:
    build: .
    image: mini-file-browser:latest
    container_name: file-browser
    restart: unless-stopped
    ports:
      - "9100:9100"
    volumes:
      # 主应用可读写文件存储。
      - file-browser-data:/data
      # 开发时挂载源码；生产环境可删除此行并使用镜像内代码。
      - ./src:/app:ro
    environment:
      FILE_STORAGE_PATH: /data
      HOST: 0.0.0.0
      PORT: 9100
      # 修改为客户端实际访问的服务器 IP 或域名，并保留端口。
      APP_BASE_URL: http://10.16.10.62:9100
      MAX_UPLOAD_SIZE: 524288000
      # ALLOWED_EXTENSIONS: .txt,.pdf,.doc,.docx,.xls,.xlsx,.png,.jpg,.zip
      SECRET_KEY: your-secret-key-change-in-production
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 9100), 5).close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  file-browser-data:
    name: file-browser-data
